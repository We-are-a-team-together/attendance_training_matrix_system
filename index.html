<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Reader Premium - Register Operative</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root { --primary-color: #06b6d4; --secondary-color: #10b981; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
  color:#fff; 
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
  min-height:100vh; 
  padding: 20px; 
}
.container { max-width:700px; margin:0 auto; }
header { 
  text-align:center; 
  padding:30px 0; 
  margin-bottom:20px; 
  border-bottom: 2px solid rgba(255,255,255,0.1); 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
}
.logo-container { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
.logo { 
  font-size:32px; 
  font-weight:900; 
  color: var(--primary-color); 
  display: flex; 
  align-items: center; 
}
.logo img { max-height: 60px; width: auto; }
.system-name { font-size: 24px; font-weight: 700; color: #fff; }
.card { 
  background: rgba(30, 41, 59, 0.8); 
  padding:35px; 
  border-radius:20px; 
  margin-bottom:20px; 
  border: 1px solid rgba(255,255,255,0.1); 
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
h2 { margin-bottom:25px; color:#f1f5f9; font-size:22px; }
.form-group { margin-bottom:20px; }
label { 
  display:block; 
  font-size:12px; 
  color:#94a3b8; 
  text-transform:uppercase; 
  letter-spacing:1px; 
  margin-bottom:8px; 
  font-weight:600; 
}
input { 
  width:100%; 
  padding:14px; 
  border-radius:12px; 
  border:2px solid rgba(255,255,255,0.1); 
  background: rgba(15, 23, 42, 0.6); 
  color:#fff; 
  font-size:15px; 
  transition: all 0.3s; 
}
input:focus { 
  outline: none; 
  border-color: var(--primary-color); 
  box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.1); 
}
.status-box { 
  padding:16px; 
  border-radius:12px; 
  text-align:center; 
  font-weight:600; 
  margin-bottom:25px; 
  font-size:15px; 
}
.status-loading { background: rgba(30, 58, 138, 0.6); color:#93c5fd; }
.status-ready { background: rgba(6, 78, 59, 0.6); color:#34d399; }
.status-error { background: rgba(127, 29, 29, 0.6); color:#f87171; }
.status-scanning { background: rgba(254, 243, 199, 0.2); color:#fbbf24; }
button { 
  width:100%; 
  padding:16px; 
  margin:10px 0; 
  border-radius:12px; 
  border:none; 
  font-weight:700; 
  cursor:pointer; 
  color:#fff; 
  font-size:16px; 
  transition: all 0.3s; 
  text-transform: uppercase; 
  letter-spacing: 1px; 
}
.btn-camera { 
  background: linear-gradient(135deg, var(--primary-color), #0891b2); 
  box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4); 
}
.btn-camera:disabled { background:#475569; opacity:0.5; cursor:not-allowed; }
.btn-capture { 
  background: linear-gradient(135deg, var(--secondary-color), #059669); 
  box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); 
  display:none; 
  font-size:18px; 
}
#video { 
  width:100%; 
  border-radius:15px; 
  display:none; 
  margin:20px 0; 
  border: 3px solid var(--primary-color); 
}
.footer { 
  text-align:center; 
  font-size:12px; 
  color:#64748b; 
  margin-top:30px; 
  padding:20px 0; 
  border-top: 1px solid rgba(255,255,255,0.1); 
}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo-container">
<div class="logo" id="brandLogo">FACE READER</div>
<div class="system-name" id="brandSystemName"></div>
</div>
</header>
<div id="statusBox" class="status-box status-loading">Loading AI models...</div>
<div class="card">
<h2>Register New Operative</h2>
<div class="form-group">
<label>Full Name *</label>
<input type="text" id="name" required>
</div>
<div class="form-group">
<label>Company / Employer *</label>
<input type="text" id="company" required>
</div>
<div class="form-group">
<label>Role / Job Title</label>
<input type="text" id="role">
</div>
<div class="form-group">
<label>Phone Number</label>
<input type="tel" id="phone">
</div>
<div class="form-group">
<label>Direct Line Manager / Supervisor</label>
<input type="text" id="supervisor">
</div>
<div class="form-group">
<label>Qualifications</label>
<input type="text" id="qualifications">
</div>
<div class="form-group">
<label>Qualification Expiry Date</label>
<input type="date" id="qualExpiry">
</div>
<div class="form-group">
<label>QR Code ID (Optional)</label>
<input type="text" id="qrCode">
</div>
<button class="btn-camera" id="btnCamera" onclick="startCamera()" disabled>Open Camera</button>
<video id="video" autoplay muted playsinline></video>
<button class="btn-capture" id="btnCapture" onclick="captureFace()">CAPTURE FACE</button>
</div>
<div class="footer" id="brandFooter">Face Reader Premium © 2026</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB_15MmxhiCHk7OADT0wlUYuJ_Fc_YyfUg",
  authDomain: "face-reader-premium.firebaseapp.com",
  projectId: "face-reader-premium",
  storageBucket: "face-reader-premium.firebasestorage.app",
  messagingSenderId: "50216820353",
  appId: "1:50216820353:web:0ee63035cfafc12759f780"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const operativesRef = db.ref('operatives');
const faceDescriptorsRef = db.ref('faceDescriptors');
const settingsRef = db.ref('settings/branding');
let videoStream = null;
let modelsLoaded = false;

function setStatus(msg, type) {
  const box = document.getElementById('statusBox');
  box.textContent = msg;
  box.className = 'status-box status-' + type;
}

async function loadModels() {
  try {
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
    modelsLoaded = true;
    setStatus('Ready! Fill in details and click Open Camera', 'ready');
    document.getElementById('btnCamera').disabled = false;
  } catch (err) {
    setStatus('Error loading models: ' + err.message, 'error');
  }
}

async function startCamera() {
  const name = document.getElementById('name').value.trim();
  const company = document.getElementById('company').value.trim();
  if (!name || !company) { 
    setStatus('Please enter Name and Company first', 'error'); 
    return; 
  }
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } 
    });
    const video = document.getElementById('video');
    video.srcObject = videoStream;
    video.style.display = 'block';
    await new Promise(r => { 
      video.onloadedmetadata = () => { 
        video.play(); 
        r(); 
      }; 
    });
    document.getElementById('btnCamera').style.display = 'none';
    document.getElementById('btnCapture').style.display = 'block';
    setStatus('Position your face clearly, then click CAPTURE FACE', 'scanning');
  } catch (err) {
    setStatus('Camera access denied. Please allow permissions.', 'error');
  }
}

async function captureFace() {
  setStatus('Capturing face...', 'scanning');
  document.getElementById('btnCapture').disabled = true;
  try {
    await new Promise(r => setTimeout(r, 500));
    const detection = await faceapi.detectSingleFace(
      document.getElementById('video'), 
      new faceapi.TinyFaceDetectorOptions({ inputSize: 640, scoreThreshold: 0.3 })
    ).withFaceLandmarks().withFaceDescriptor();
    
    if (!detection) { 
      setStatus('No face detected! Try better lighting.', 'error'); 
      document.getElementById('btnCapture').disabled = false; 
      return; 
    }
    
    const operativeData = {
      name: document.getElementById('name').value.trim(),
      company: document.getElementById('company').value.trim(),
      role: document.getElementById('role').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      supervisor: document.getElementById('supervisor').value.trim(),
      qualifications: document.getElementById('qualifications').value.trim(),
      qualExpiry: document.getElementById('qualExpiry').value.trim(),
      qrCode: document.getElementById('qrCode').value.trim(),
      createdAt: firebase.database.ServerValue.TIMESTAMP
    };
    
    const newRef = operativesRef.push();
    await newRef.set(operativeData);
    await faceDescriptorsRef.child(newRef.key).set({
      descriptor: Array.from(detection.descriptor),
      name: operativeData.name,
      company: operativeData.company
    });
    
    setStatus('Successfully registered: ' + operativeData.name, 'ready');
    if (videoStream) { 
      videoStream.getTracks().forEach(t => t.stop()); 
      videoStream = null; 
    }
    document.getElementById('video').style.display = 'none';
    document.getElementById('btnCamera').style.display = 'block';
    document.getElementById('btnCapture').style.display = 'none';
    document.getElementById('btnCapture').disabled = false;
    document.querySelectorAll('input').forEach(i => i.value = '');
    setTimeout(() => setStatus('Ready! Fill in details and click Open Camera', 'ready'), 3000);
  } catch (err) {
    setStatus('Error: ' + err.message, 'error');
    document.getElementById('btnCapture').disabled = false;
  }
}

// Branding System
function applyBranding(data) {
  if (!data) return;
  document.documentElement.style.setProperty('--primary-color', data.color || '#06b6d4');
  document.documentElement.style.setProperty('--secondary-color', data.color2 || '#10b981');
  const logoEl = document.getElementById('brandLogo');
  const nameEl = document.getElementById('brandSystemName');
  if (logoEl) {
    if (data.logoUrl) {
      logoEl.innerHTML = `<img src="${data.logoUrl}" alt="Logo">`;
    } else {
      logoEl.textContent = data.name || 'FACE READER';
      logoEl.style.color = data.color;
    }
  }
  if (nameEl) nameEl.textContent = data.name || '';
  const footerEl = document.getElementById('brandFooter');
  if (footerEl) footerEl.textContent = data.footer || 'Face Reader Premium © 2026';
  document.title = (data.name || 'Face Reader Premium') + ' - Register Operative';
}

settingsRef.on('value', snap => {
  const data = snap.val();
  if (data) applyBranding(data);
  else {
    document.title = 'Face Reader Premium - Register Operative';
  }
});

loadModels();
</script>
</body>
</html>
