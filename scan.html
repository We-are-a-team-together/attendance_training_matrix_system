<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Face Reader Premium - Together We Build Trust</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root { --primary-color: #06b6d4; --secondary-color: #10b981; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { 
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
  color:#fff; 
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
  min-height:100vh; 
  position: relative; 
  overflow-x: hidden; 
}
.container { 
  max-width:650px; 
  margin:0 auto; 
  padding:30px 20px; 
  position: relative; 
  z-index: 1; 
}
header { 
  text-align:center; 
  padding:30px 0; 
  margin-bottom:20px; 
}
.logo-container { display: flex; align-items: center; gap: 15px; justify-content: center; margin-bottom: 10px; }
.logo { 
  font-size:32px; 
  font-weight:900; 
  color: var(--primary-color); 
  display: flex; 
  align-items: center; 
}
.logo img { max-height: 60px; width: auto; }
.system-name { font-size: 24px; font-weight: 700; color: #fff; }
.tagline { 
  color:#94a3b8; 
  font-size:14px; 
  margin-top:8px; 
  letter-spacing: 3px; 
  text-transform: uppercase; 
  font-weight: 600; 
}
.card { 
  background: rgba(30, 41, 59, 0.8); 
  padding:30px; 
  border-radius:20px; 
  margin-bottom:20px; 
  border: 1px solid rgba(255,255,255,0.1); 
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
h2 { 
  margin:0 0 20px; 
  font-size:14px; 
  color:#94a3b8; 
  text-transform:uppercase; 
  letter-spacing:2px; 
  font-weight:700; 
}
button { 
  width:100%; 
  padding:18px; 
  margin:10px 0; 
  border-radius:12px; 
  border:none; 
  font-weight:700; 
  cursor:pointer; 
  color:#fff; 
  font-size:16px; 
  transition: all 0.3s ease; 
  text-transform: uppercase; 
  letter-spacing: 1px; 
}
.btn-face { 
  background: linear-gradient(135deg, var(--primary-color), #0891b2); 
  box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4); 
}
.btn-capture { 
  background: linear-gradient(135deg, var(--secondary-color), #059669); 
  box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); 
  display:none; 
}
.btn-capture.out { 
  background: linear-gradient(135deg, #ef4444, #dc2626); 
}
.btn-qr { 
  background: linear-gradient(135deg, #059669, #047857); 
  box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4); 
}
.btn-qr.scanning { 
  background: linear-gradient(135deg, #dc2626, #b91c1c); 
  animation: pulse 1.5s infinite; 
}
@keyframes pulse { 
  0%, 100% { opacity: 1; } 
  50% { opacity: 0.7; } 
}
#video { 
  width:100%; 
  border-radius:15px; 
  display:none; 
  margin-bottom:15px; 
  border: 3px solid var(--primary-color); 
}
#qr-reader { 
  display:none; 
  border-radius:15px; 
  overflow:hidden; 
}
.status-box { 
  padding:24px; 
  border-radius:15px; 
  text-align:center; 
  font-weight:600; 
  font-size:16px; 
  margin-bottom:25px; 
  border: 2px solid transparent; 
  min-height: 80px; 
  display: flex; 
  flex-direction: column; 
  justify-content: center; 
  align-items: center; 
}
.status-idle { 
  background: rgba(30, 41, 59, 0.6); 
  color:#94a3b8; 
  border-color: rgba(255,255,255,0.1); 
}
.status-scanning { 
  background: rgba(254, 243, 199, 0.2); 
  color:#fbbf24; 
  border-color: rgba(251, 191, 36, 0.3); 
}
.status-success { 
  background: rgba(6, 78, 59, 0.6); 
  color:#34d399; 
  border-color: rgba(52, 211, 153, 0.3); 
}
.status-error { 
  background: rgba(127, 29, 29, 0.6); 
  color:#f87171; 
  border-color: rgba(248, 113, 113, 0.3); 
}
.status-info { 
  background: rgba(30, 58, 138, 0.6); 
  color:#93c5fd; 
  border-color: rgba(147, 197, 253, 0.3); 
}
.location-info { 
  background: rgba(99, 102, 241, 0.2); 
  color:#a5b4fc; 
  padding:12px; 
  border-radius:10px; 
  margin-top:15px; 
  font-size:13px; 
  display:none; 
  border: 1px solid rgba(99, 102, 241, 0.3); 
}
.footer { 
  text-align:center; 
  font-size:12px; 
  color:#64748b; 
  margin-top:30px; 
  padding:20px 0; 
  border-top: 1px solid rgba(255,255,255,0.1); 
}
.privacy-notice { 
  background: rgba(249, 115, 22, 0.1); 
  border: 1px solid rgba(249, 115, 22, 0.3); 
  padding:15px; 
  border-radius:10px; 
  margin-bottom:20px; 
  font-size:12px; 
  color:#fbbf24; 
  text-align:center; 
}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo-container">
<div class="logo" id="brandLogo">FACE READER</div>
<div class="system-name" id="brandSystemName"></div>
</div>
<div class="tagline">Together We Build Trust</div>
</header>
<div class="privacy-notice">🔒 Your attendance and location are securely recorded</div>
<div id="statusBox" class="status-box status-idle">Ready to sign in</div>
<div class="card">
<h2> Face Recognition</h2>
<button type="button" class="btn-face" id="btnFace" onclick="startFaceScan()">Start Face Scan</button>
<button type="button" class="btn-capture" id="btnCapture" onclick="captureFace()">Capture & Sign In</button>
<video id="video" autoplay muted playsinline></video>
<div id="locationInfo" class="location-info">
<span>📍</span>
<span id="locationText">Acquiring location...</span>
</div>
</div>
<div class="card">
<h2>📷 QR Code</h2>
<div id="qr-reader"></div>
<button type="button" class="btn-qr" id="btnQr" onclick="toggleQrScan()">Open Camera for QR</button>
</div>
<div class="footer" id="brandFooter">Face Reader Premium © 2026</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB_15MmxhiCHk7OADT0wlUYuJ_Fc_YyfUg",
  authDomain: "face-reader-premium.firebaseapp.com",
  projectId: "face-reader-premium",
  storageBucket: "face-reader-premium.firebasestorage.app",
  messagingSenderId: "50216820353",
  appId: "1:50216820353:web:0ee63035cfafc12759f780"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const signinsRef = db.ref('signins');
const statusRef = db.ref('status');
const operativesRef = db.ref('operatives');
const faceDescriptorsRef = db.ref('faceDescriptors');
const settingsRef = db.ref('settings/branding');

let isFaceScanning = false, isQrScanning = false, videoStream = null, qrScanner = null;
let faceDescriptors = {}, operatives = {}, modelsLoaded = false, currentLocation = null;

async function loadModels() {
  const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
  ]);
  modelsLoaded = true;
}

faceDescriptorsRef.on('value', snap => { 
  faceDescriptors = {}; 
  snap.forEach(child => { faceDescriptors[child.key] = child.val(); }); 
});
operativesRef.on('value', snap => { 
  operatives = {}; 
  snap.forEach(child => { operatives[child.key] = child.val(); }); 
});

function showStatus(msg, type, isHtml = false) {
  const box = document.getElementById('statusBox');
  if (isHtml) box.innerHTML = msg;
  else box.textContent = msg;
  box.className = 'status-box status-' + type;
}

function showLocationInfo(text) {
  document.getElementById('locationText').textContent = text;
  document.getElementById('locationInfo').style.display = 'block';
}

function hideLocationInfo() {
  document.getElementById('locationInfo').style.display = 'none';
}

function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { 
      reject(new Error('Geolocation not supported')); 
      return; 
    }
    showLocationInfo('📍 Acquiring location...');
    navigator.geolocation.getCurrentPosition(
      async (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = position.coords.accuracy;
        showLocationInfo(` Location acquired (${accuracy.toFixed(0)}m accuracy)`);
        try {
          const response = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, 
            { headers: { 'User-Agent': 'FaceReader Attendance' } }
          );
          const data = await response.json();
          if (data.display_name) {
            const addr = data.address;
            const parts = [];
            if (addr.road) parts.push(addr.road);
            if (addr.city || addr.town || addr.village) parts.push(addr.city || addr.town || addr.village);
            if (addr.postcode) parts.push(addr.postcode);
            resolve({ lat, lng, accuracy, address: parts.join(', ') || data.display_name });
          } else {
            resolve({ lat, lng, accuracy, address: `${lat.toFixed(4)}, ${lng.toFixed(4)}` });
          }
        } catch (err) {
          resolve({ lat, lng, accuracy, address: `${lat.toFixed(4)}, ${lng.toFixed(4)}` });
        }
      },
      (error) => { 
        hideLocationInfo(); 
        reject(error); 
      }, 
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

async function startFaceScan() {
  if (!modelsLoaded) await loadModels();
  if (isQrScanning) stopQrScan();
  try { 
    currentLocation = await getLocation(); 
  } catch (err) { 
    showStatus('⚠️ Location access denied.', 'error'); 
    setTimeout(() => showStatus('Ready to sign in', 'idle'), 3000); 
    return; 
  }
  isFaceScanning = true;
  document.getElementById('btnFace').style.display = 'none';
  document.getElementById('btnCapture').style.display = 'block';
  showStatus('👤 Position your face in the camera', 'scanning');
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } 
    });
    const video = document.getElementById('video');
    video.srcObject = videoStream;
    video.style.display = 'block';
    await new Promise(r => { 
      video.onloadedmetadata = () => { 
        video.play(); 
        r(); 
      }; 
    });
    detectFaceLoop();
  } catch (err) { 
    hideLocationInfo(); 
    showStatus('❌ Camera error', 'error'); 
    stopFaceScan(); 
  }
}

function stopFaceScan() {
  isFaceScanning = false;
  document.getElementById('btnFace').style.display = 'block';
  document.getElementById('btnCapture').style.display = 'none';
  document.getElementById('video').style.display = 'none';
  hideLocationInfo();
  if (videoStream) { 
    videoStream.getTracks().forEach(t => t.stop()); 
    videoStream = null; 
  }
  currentLocation = null;
  showStatus('Ready to sign in', 'idle');
}

async function detectFaceLoop() {
  if (!isFaceScanning) return;
  try {
    const video = document.getElementById('video');
    if (!video || video.readyState !== 4) { 
      setTimeout(detectFaceLoop, 500); 
      return; 
    }
    const detection = await faceapi.detectSingleFace(
      video, 
      new faceapi.TinyFaceDetectorOptions({ inputSize: 512, scoreThreshold: 0.3 })
    ).withFaceLandmarks().withFaceDescriptor();
    
    if (detection) {
      const result = findBestMatch(detection.descriptor);
      if (result.match) { 
        await recordSignin(
          result.match.id, 
          result.match.name, 
          result.match.company, 
          result.match.assignedLocation, 
          'FACE'
        ); 
        stopFaceScan(); 
      } else { 
        hideLocationInfo(); 
        showStatus('Face not recognized - try QR code', 'error'); 
        setTimeout(() => { 
          if (isFaceScanning) showStatus('Position your face in the camera', 'scanning'); 
        }, 3000); 
      }
    }
  } catch (err) { 
    console.error(err); 
  }
  if (isFaceScanning) setTimeout(detectFaceLoop, 500);
}

async function captureFace() {
  showStatus('⏳ Capturing...', 'info');
  try {
    const detection = await faceapi.detectSingleFace(
      document.getElementById('video'), 
      new faceapi.TinyFaceDetectorOptions({ inputSize: 512, scoreThreshold: 0.3 })
    ).withFaceLandmarks().withFaceDescriptor();
    
    if (!detection) { 
      hideLocationInfo(); 
      showStatus('⚠️ No face detected', 'error'); 
      return; 
    }
    const result = findBestMatch(detection.descriptor);
    if (result.match) { 
      await recordSignin(
        result.match.id, 
        result.match.name, 
        result.match.company, 
        result.match.assignedLocation, 
        'FACE'
      ); 
      stopFaceScan(); 
    } else { 
      hideLocationInfo(); 
      showStatus('Face not recognized - try QR', 'error'); 
    }
  } catch (err) { 
    hideLocationInfo(); 
    showStatus('❌ Error', 'error'); 
  }
}

function findBestMatch(inputDescriptor) {
  const THRESHOLD = 0.75;
  for (const [id, data] of Object.entries(faceDescriptors)) {
    const distance = faceapi.euclideanDistance(
      inputDescriptor, 
      new Float32Array(data.descriptor)
    );
    if (distance < THRESHOLD) {
      const op = operatives[id];
      if (op) {
        return { 
          match: { 
            id, 
            name: op.name, 
            company: op.company, 
            assignedLocation: op.location || 'Unassigned' 
          } 
        };
      }
    }
  }
  return { match: null };
}

async function recordSignin(operativeId, name, company, assignedLocation, method) {
  try {
    const statusSnap = await statusRef.child(operativeId).once('value');
    const currentStatus = statusSnap.val();
    const action = (currentStatus && currentStatus.onSite) ? 'OUT' : 'IN';
    
    const signinData = {
      operativeId,
      operativeName: name,
      operativeCompany: company,
      assignedLocation: assignedLocation || 'Unassigned',
      action,
      method,
      timestamp: firebase.database.ServerValue.TIMESTAMP,
      date: new Date().toISOString().slice(0,10)
    };
    
    if (currentLocation) {
      signinData.gpsLocation = {
        lat: currentLocation.lat,
        lng: currentLocation.lng,
        accuracy: currentLocation.accuracy,
        address: currentLocation.address,
        timestamp: Date.now()
      };
    }
    
    await signinsRef.push(signinData);
    await statusRef.child(operativeId).set({
      onSite: action === 'IN',
      lastAction: action,
      lastTimestamp: firebase.database.ServerValue.TIMESTAMP,
      company: company,
      assignedLocation: assignedLocation || 'Unassigned'
    });
    
    const actionText = action === 'IN' ? 'SUCCESSFULLY SIGNED IN' : 'SUCCESSFULLY SIGNED OUT';
    const icon = action === 'IN' ? '✅' : '👋';
    const accentColor = action === 'IN' ? '#34d399' : '#fbbf24';
    const locText = currentLocation ? 
      `<div style="font-size: 13px; color: #a5b4fc; margin-top: 8px;">📍 ${currentLocation.address}</div>` : '';
    const msg = `
      <div style="font-size: 22px; font-weight: 800; color: ${accentColor}; margin-bottom: 8px;">
        ${icon} ${actionText}
      </div>
      <div style="font-size: 18px; font-weight: 600; color: #fff;">${name}</div>
      <div style="font-size: 14px; color: #94a3b8;">${company}</div>
      ${locText}
    `;
    
    showStatus(msg, 'success', true);
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    setTimeout(() => { 
      if (!isFaceScanning && !isQrScanning) showStatus('Ready to sign in', 'idle'); 
    }, 6000);
  } catch (err) { 
    hideLocationInfo(); 
    showStatus('❌ Error saving: ' + err.message, 'error'); 
  }
}

function toggleQrScan() { 
  if (isQrScanning) stopQrScan(); 
  else startQrScan(); 
}

async function startQrScan() {
  if (isFaceScanning) stopFaceScan();
  try { 
    currentLocation = await getLocation(); 
  } catch (err) { 
    console.error('Location error:', err); 
  }
  isQrScanning = true;
  document.getElementById('btnQr').classList.add('scanning');
  document.getElementById('btnQr').textContent = 'Stop QR Scan';
  showStatus('📷 Point camera at QR code', 'scanning');
  document.getElementById('qr-reader').style.display = 'block';
  
  // Only create scanner if it doesn't exist
  if (!qrScanner) {
    qrScanner = new Html5Qrcode("qr-reader");
  }
  
  qrScanner.start(
    { facingMode: "environment" }, 
    { fps: 10, qrbox: { width: 240, height: 240 } }, 
    (decodedText) => { 
      handleQrCode(decodedText); 
      stopQrScan(); 
    }, 
    () => {}
  ).catch(err => { 
    hideLocationInfo(); 
    showStatus('QR error', 'error'); 
    stopQrScan(); 
  });
}

function stopQrScan() {
  isQrScanning = false;
  document.getElementById('btnQr').classList.remove('scanning');
  document.getElementById('btnQr').textContent = 'Open Camera for QR';
  document.getElementById('qr-reader').style.display = 'none';
  hideLocationInfo();
  if (qrScanner) { 
    try { 
      qrScanner.stop(); 
    } catch(e){} 
    qrScanner = null; 
  }
  currentLocation = null;
  showStatus('Ready to sign in', 'idle');
}

async function handleQrCode(qrData) {
  for (const [id, data] of Object.entries(operatives)) {
    if (data.qrCode === qrData || id === qrData) {
      await recordSignin(
        id, 
        data.name, 
        data.company, 
        data.location || 'Unassigned', 
        'QR'
      );
      return;
    }
  }
  hideLocationInfo();
  showStatus('❌ Unknown QR code', 'error');
}

// Branding System
function applyBranding(data) {
  if (!data) return;
  document.documentElement.style.setProperty('--primary-color', data.color || '#06b6d4');
  document.documentElement.style.setProperty('--secondary-color', data.color2 || '#10b981');
  const logoEl = document.getElementById('brandLogo');
  const nameEl = document.getElementById('brandSystemName');
  if (logoEl) {
    if (data.logoUrl) {
      logoEl.innerHTML = `<img src="${data.logoUrl}" alt="Logo">`;
    } else {
      logoEl.textContent = data.name || 'FACE READER';
      logoEl.style.color = data.color;
    }
  }
  if (nameEl) nameEl.textContent = data.name || '';
  const footerEl = document.getElementById('brandFooter');
  if (footerEl) footerEl.textContent = data.footer || 'Face Reader Premium © 2026';
  document.title = (data.name || 'Face Reader Premium') + ' - Together We Build Trust';
}

settingsRef.on('value', snap => {
  const data = snap.val();
  if (data) applyBranding(data);
  else {
    document.title = 'Face Reader Premium - Together We Build Trust';
  }
});

loadModels();
</script>
</body>
</html>
