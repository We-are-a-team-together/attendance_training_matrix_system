<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Reader - Admin Panel</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color:#fff; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height:100vh; position: relative; }
.container { max-width:900px; margin:0 auto; padding:30px 20px; position: relative; z-index: 1; }
header { display:flex; justify-content:space-between; align-items:center; padding:25px 0; margin-bottom:30px; border-bottom: 2px solid rgba(255,255,255,0.1); }
.logo-container { display: flex; align-items: center; gap: 15px; }
.logo { font-size:24px; font-weight:800; color: var(--primary-color, #06b6d4); display: flex; align-items: center; }
.logo img { max-height: 50px; width: auto; }
.system-name { font-size: 20px; font-weight: 700; color: #fff; }
.badge { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color:#fff; padding:8px 16px; border-radius:20px; font-size:12px; font-weight:700; text-transform: uppercase; }
.card { background: rgba(30, 41, 59, 0.8); padding:30px; border-radius:20px; margin-bottom:25px; border: 1px solid rgba(255,255,255,0.1); }
h2 { margin:0 0 25px; font-size:20px; color:#f1f5f9; font-weight:700; }
.input-group { margin-bottom:20px; }
label { display:block; font-size:12px; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; font-weight:600; }
input, select { width:100%; padding:14px 16px; border-radius:12px; border:2px solid rgba(255,255,255,0.1); background: rgba(15, 23, 42, 0.6); color:#fff; font-size:15px; }
input:focus, select:focus { outline: none; border-color: var(--primary-color, #06b6d4); }
.btn-group { display:flex; gap:12px; flex-wrap:wrap; margin-top:25px; }
button { padding:14px 24px; border-radius:12px; border:none; font-weight:700; cursor:pointer; color:#fff; text-transform: uppercase; font-size:14px; }
.btn-save { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); }
.btn-cancel { background: linear-gradient(135deg, #64748b 0%, #475569 100%); }
.btn-edit { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); padding:10px 16px; font-size:12px; }
.btn-delete { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); padding:10px 16px; font-size:12px; }
.btn-register { display:block; width:100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); padding:20px; text-align:center; text-decoration:none; color:white; font-weight:700; border-radius:15px; margin-bottom:25px; }
.operative-item { background: rgba(15, 23, 42, 0.6); padding:20px; border-radius:15px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:flex-start; border: 1px solid rgba(255,255,255,0.05); }
.name { font-weight:700; font-size:17px; color:#f1f5f9; margin-bottom:5px; }
.details { font-size:13px; color:#94a3b8; line-height: 1.5; }
.company { color:#f97316; font-weight:600; }
.location { color:#a855f7; font-weight:600; }
.actions { display:flex; gap:10px; flex-shrink: 0; margin-left: 15px; }
.status-msg { padding:16px 20px; border-radius:12px; text-align:center; font-weight:600; margin-bottom:25px; display:none; }
.success { background: rgba(6, 78, 59, 0.6); color:#34d399; border: 1px solid rgba(52, 211, 153, 0.3); display:block; }
.error { background: rgba(127, 29, 29, 0.6); color:#f87171; border: 1px solid rgba(248, 113, 113, 0.3); display:block; }
.footer { text-align:center; font-size:12px; color:#64748b; margin-top:40px; padding:25px 0; border-top: 1px solid rgba(255,255,255,0.1); }
.empty { text-align:center; color:#64748b; padding:40px; font-size:15px; }
.filter-container { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo-container">
<div class="logo" id="brandLogo"></div>
<div class="system-name" id="brandSystemName"></div>
</div>
<div class="badge">Admin Panel</div>
</header>
<a href="index.html" class="btn-register">📷 Go to Face Registration Page</a>
<div id="statusMsg" class="status-msg"></div>
<div class="card">
<h2 id="formTitle">➕ Add / Edit Operative</h2>
<form id="operativeForm">
<input type="hidden" id="operativeId">
<div class="input-group"><label>Full Name *</label><input type="text" id="name" required></div>
<div class="input-group"><label>Company / Employer *</label><input type="text" id="company" required></div>
<div class="input-group"><label>Assigned Location (e.g., Site A) *</label><input type="text" id="location" required></div>
<div class="input-group"><label>Role / Job Title</label><input type="text" id="role"></div>
<div class="input-group"><label>Phone Number</label><input type="tel" id="phone"></div>
<div class="input-group"><label>Direct Line Manager / Supervisor</label><input type="text" id="supervisor"></div>
<div class="input-group"><label>Qualifications</label><input type="text" id="qualifications"></div>
<div class="input-group"><label>Qualification Expiry Date</label><input type="date" id="qualExpiry"></div>
<div class="input-group"><label>QR Code ID (Optional)</label><input type="text" id="qrCode"></div>
<div class="btn-group">
<button type="submit" class="btn-save">💾 Save Details</button>
<button type="button" class="btn-cancel" onclick="resetForm()">Cancel</button>
</div>
</form>
</div>
<div class="card">
<h2>👥 Registered Operatives (<span id="count">0</span>)</h2>
<div class="filter-container">
<label style="color:#94a3b8;">Filter by Location:</label>
<select id="adminLocationFilter" onchange="render()" style="width:auto; min-width:200px;"><option value="all">All Locations</option></select>
</div>
<div id="operativeList"><div class="empty">Loading operatives...</div></div>
</div>
<div class="footer" id="brandFooterText">Face Reader Premium © 2026</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB_15MmxhiCHk7OADT0wlUYuJ_Fc_YyfUg",
  authDomain: "face-reader-premium.firebaseapp.com",
  projectId: "face-reader-premium",
  storageBucket: "face-reader-premium.firebasestorage.app",
  messagingSenderId: "50216820353",
  appId: "1:50216820353:web:0ee63035cfafc12759f780"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const operativesRef = db.ref('operatives');
const faceDescriptorsRef = db.ref('faceDescriptors');
const settingsRef = db.ref('settings/branding');
let operatives = {};

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg; el.className = 'status-msg ' + type; el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}
function resetForm() {
  document.getElementById('operativeForm').reset();
  document.getElementById('operativeId').value = '';
  document.getElementById('formTitle').textContent = '➕ Add / Edit Operative';
}

document.getElementById('operativeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('operativeId').value;
  const data = {
    name: document.getElementById('name').value.trim(),
    company: document.getElementById('company').value.trim(),
    location: document.getElementById('location').value.trim(),
    role: document.getElementById('role').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    supervisor: document.getElementById('supervisor').value.trim(),
    qualifications: document.getElementById('qualifications').value.trim(),
    qualExpiry: document.getElementById('qualExpiry').value.trim(),
    qrCode: document.getElementById('qrCode').value.trim(),
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  };
  try {
    if (id) {
      await operativesRef.child(id).update(data);
      await faceDescriptorsRef.child(id).update({ name: data.name, company: data.company, location: data.location });
      showStatus('✅ Updated successfully', 'success');
    } else {
      data.createdAt = firebase.database.ServerValue.TIMESTAMP;
      const newRef = await operativesRef.push(data);
      await faceDescriptorsRef.child(newRef.key).set({ name: data.name, company: data.company, location: data.location });
      showStatus('✅ Added! Use Face Registration to capture face', 'success');
    }
    resetForm();
  } catch (err) { showStatus('❌ Error: ' + err.message, 'error'); }
});

function editOperative(id) {
  const o = operatives[id];
  document.getElementById('operativeId').value = id;
  document.getElementById('name').value = o.name || '';
  document.getElementById('company').value = o.company || '';
  document.getElementById('location').value = o.location || '';
  document.getElementById('role').value = o.role || '';
  document.getElementById('phone').value = o.phone || '';
  document.getElementById('supervisor').value = o.supervisor || '';
  document.getElementById('qualifications').value = o.qualifications || '';
  document.getElementById('qualExpiry').value = o.qualExpiry || '';
  document.getElementById('qrCode').value = o.qrCode || '';
  document.getElementById('formTitle').textContent = '✏️ Edit: ' + (o.name || 'Unnamed');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteOperative(id) {
  if (!confirm('⚠️ Delete this operative and their face data?')) return;
  try {
    await operativesRef.child(id).remove();
    await faceDescriptorsRef.child(id).remove();
    showStatus('✅ Deleted successfully', 'success');
  } catch (err) { showStatus('❌ Error: ' + err.message, 'error'); }
}

function render() {
  const list = Object.entries(operatives).map(([id, o]) => ({ id, ...o }));
  const locFilter = document.getElementById('adminLocationFilter').value;
  let filteredList = locFilter !== 'all' ? list.filter(o => o.location === locFilter) : list;
  
  document.getElementById('count').textContent = filteredList.length;
  if (filteredList.length === 0) { document.getElementById('operativeList').innerHTML = '<div class="empty">No operatives found.</div>'; return; }
  
  filteredList.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  document.getElementById('operativeList').innerHTML = filteredList.map(o => `
    <div class="operative-item">
      <div style="flex:1;">
        <div class="name">${o.name || 'Unnamed'}</div>
        <div class="details">
          <span class="location">📍 ${o.location || 'No location'}</span><br>
          <span class="company">${o.company || 'No Company'}</span> • ${o.role || 'No role'}
          ${o.phone ? '<br>📞 ' + o.phone : ''}
          ${o.supervisor ? '<br>👤 Supervisor: ' + o.supervisor : ''}
          ${o.qualifications ? '<br>📜 Quals: ' + o.qualifications : ''}
          ${o.qualExpiry ? '<br>📅 Expires: ' + o.qualExpiry : ''}
        </div>
      </div>
      <div class="actions">
        <button class="btn-edit" onclick="editOperative('${o.id}')">✏️ Edit</button>
        <button class="btn-delete" onclick="deleteOperative('${o.id}')">🗑️ Delete</button>
      </div>
    </div>
  `).join('');
}

function updateAdminLocationDropdown() {
  const select = document.getElementById('adminLocationFilter');
  const currentVal = select.value;
  const locations = new Set(['all']);
  Object.values(operatives).forEach(o => { if(o.location) locations.add(o.location); });
  select.innerHTML = '';
  Array.from(locations).sort().forEach(loc => {
    const opt = document.createElement('option');
    opt.value = loc; opt.textContent = loc === 'all' ? 'All Locations' : loc;
    select.appendChild(opt);
  });
  select.value = locations.has(currentVal) ? currentVal : 'all';
}

settingsRef.on('value', snap => {
  const data = snap.val(); if (!data) return;
  document.documentElement.style.setProperty('--primary-color', data.color || '#06b6d4');
  document.documentElement.style.setProperty('--secondary-color', data.color2 || '#10b981');
  const logoEl = document.getElementById('brandLogo');
  const nameEl = document.getElementById('brandSystemName');
  if (logoEl) {
    if (data.logoUrl) logoEl.innerHTML = `<img src="${data.logoUrl}">`;
    else { logoEl.textContent = data.name || 'FACE READER'; logoEl.style.color = data.color; }
  }
  if (nameEl) nameEl.textContent = data.name || '';
  const footerEl = document.getElementById('brandFooterText');
  if (footerEl) footerEl.textContent = data.footer || 'Face Reader Premium © 2026';
});

operativesRef.on('value', snap => {
  operatives = {};
  snap.forEach(child => { operatives[child.key] = child.val(); });
  updateAdminLocationDropdown();
  render();
});
</script>
</body>
</html>
