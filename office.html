<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Reader Premium - Office Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root { --primary-color: #06b6d4; --secondary-color: #10b981; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color:#fff; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height:100vh; }
.container { max-width:1400px; margin:0 auto; padding:30px 20px; }
header { display:flex; justify-content:space-between; align-items:center; padding:25px 0; margin-bottom:30px; border-bottom: 2px solid rgba(255,255,255,0.1); }
.logo { font-size:36px; font-weight:900; background: linear-gradient(135deg, #06b6d4 0%, #f97316 50%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
.badge { background: linear-gradient(135deg, var(--secondary-color), #059669); color:#fff; padding:8px 16px; border-radius:20px; font-size:12px; font-weight:700; text-transform: uppercase; letter-spacing: 2px; }
.tagline { color:#94a3b8; font-size:13px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; text-align: center; margin-top: -20px; margin-bottom: 20px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:20px; margin-bottom:30px; }
.stat { background: rgba(30, 41, 59, 0.8); padding:30px; border-radius:20px; text-align:center; border: 1px solid rgba(255,255,255,0.1); }
.num { font-size:56px; font-weight:900; margin-bottom:10px; }
.green { color:#10b981; } .blue { color:#06b6d4; } .amber { color:#f97316; } .purple { color:#a855f7; }
.label { font-size:12px; color:#94a3b8; text-transform:uppercase; letter-spacing:2px; font-weight:600; }
.card { background: rgba(30, 41, 59, 0.8); padding:30px; border-radius:20px; margin-bottom:25px; border: 1px solid rgba(255,255,255,0.1); }
h2 { margin:0 0 25px; font-size:18px; color:#f1f5f9; font-weight:700; }
.company-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; }
.company-item { background: rgba(15, 23, 42, 0.6); padding:25px; border-radius:15px; border-left: 5px solid #f97316; }
.company-name { font-weight:700; margin-bottom:10px; font-size:16px; color:#f1f5f9; }
.company-count { font-size:48px; font-weight:900; color:#f97316; line-height: 1; }
.controls { display:flex; gap:15px; margin-bottom:25px; flex-wrap:wrap; }
input { flex:1; padding:14px 18px; border-radius:12px; border:2px solid rgba(255,255,255,0.1); background: rgba(15, 23, 42, 0.6); color:#fff; font-size:15px; min-width:250px; }
input:focus { outline: none; border-color: var(--primary-color); }
button { padding:14px 24px; border-radius:12px; border:none; font-weight:700; cursor:pointer; color:#fff; text-transform: uppercase; letter-spacing: 1px; font-size:14px; }
.btn-refresh { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); }
.btn-export { background: linear-gradient(135deg, var(--primary-color), #0891b2 100%); }
.btn-clear { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
button:hover { transform: translateY(-2px); }
.table-container { overflow-x: auto; }
table { width:100%; border-collapse:separate; border-spacing: 0; min-width: 1000px; }
th { background: rgba(15, 23, 42, 0.8); padding:16px; text-align:left; font-size:11px; color:#94a3b8; text-transform:uppercase; letter-spacing: 1.5px; font-weight:700; }
th:first-child { border-top-left-radius: 10px; }
th:last-child { border-top-right-radius: 10px; }
td { padding:18px 16px; border-bottom:1px solid rgba(255,255,255,0.05); vertical-align: top; }
tr:hover { background: rgba(255,255,255,0.05); }
.method-badge { padding:6px 14px; border-radius:20px; font-size:11px; font-weight:700; text-transform: uppercase; letter-spacing: 1px; display: inline-block; }
.face { background: rgba(6, 182, 212, 0.2); color:#22d3ee; border: 1px solid rgba(34, 211, 238, 0.3); }
.qr { background: rgba(5, 150, 105, 0.2); color:#34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
.action-badge { padding:6px 14px; border-radius:20px; font-size:12px; font-weight:700; text-transform: uppercase; letter-spacing: 1px; display: inline-block; }
.in { background: rgba(16, 185, 129, 0.2); color:#34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
.out { background: rgba(249, 115, 22, 0.2); color:#fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
.time { color:#94a3b8; font-family:'Courier New', monospace; font-size:14px; white-space: nowrap; }
.location-cell { font-size:12px; color:#a5b4fc; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.location-icon { display:inline-block; margin-right:5px; color:#f97316; }
.map-link { color:var(--primary-color); text-decoration:none; font-size:11px; margin-left:5px; white-space: nowrap; }
.map-link:hover { text-decoration:underline; }
.empty { text-align:center; color:#64748b; padding:50px; font-size:16px; }
.footer { text-align:center; font-size:12px; color:#64748b; margin-top:40px; padding:25px 0; border-top: 1px solid rgba(255,255,255,0.1); }
.expired { color: #f87171; font-weight: 700; }
.valid { color: #34d399; }
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">FACE READER</div>
<div class="badge">● Live</div>
</header>
<div class="tagline">Together We Build Trust</div>
<div class="stats">
<div class="stat"><div class="num green" id="onsite">0</div><div class="label">Currently On Site</div></div>
<div class="stat"><div class="num blue" id="total">0</div><div class="label">Total Sign-Ins Today</div></div>
<div class="stat"><div class="num amber" id="recent">0</div><div class="label">Last 15 Minutes</div></div>
<div class="stat"><div class="num purple" id="unique">0</div><div class="label">Unique Operatives</div></div>
</div>
<div class="card">
<h2>📊 Operatives by Company</h2>
<div class="company-grid" id="companyGrid"><div class="empty">Loading...</div></div>
</div>
<div class="controls">
<input type="text" id="search" placeholder="🔍 Filter by name, company, phone, or qualifications...">
<button class="btn-refresh" onclick="location.reload()">↻ Refresh</button>
<button class="btn-export" onclick="exportCSV()">📥 Export CSV</button>
<button class="btn-clear" onclick="clearToday()"> Clear Today</button>
</div>
<div class="card">
<div class="table-container">
<table>
<thead>
<tr>
<th>Operative</th>
<th>Contact / Supervisor</th>
<th>Qualifications & Expiry</th>
<th>Method</th>
<th>Action</th>
<th>Location</th>
<th>Time</th>
</tr>
</thead>
<tbody id="tbody"><tr><td colspan="7" class="empty">Connecting to database...</td></tr></tbody>
</table>
</div>
</div>
<div class="footer" id="brandFooter">Face Reader Premium © 2026</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB_15MmxhiCHk7OADT0wlUYuJ_Fc_YyfUg",
  authDomain: "face-reader-premium.firebaseapp.com",
  databaseURL: "https://face-reader-premium-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "face-reader-premium",
  storageBucket: "face-reader-premium.firebasestorage.app",
  messagingSenderId: "50216820353",
  appId: "1:50216820353:web:0ee63035cfafc12759f780"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const signinsRef = db.ref('signins');
const statusRef = db.ref('status');
const operativesRef = db.ref('operatives');
const settingsRef = db.ref('settings/branding');
let allRecords = [];
let statusData = {};
let operativesData = {};

function todayStart() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function escapeHtml(text) { if (!text) return ''; const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }; return String(text).replace(/[&<>"']/g, m => map[m]); }
function timeAgo(ts) { if (!ts) return 'unknown'; const s = Math.floor((Date.now() - ts) / 1000); if (s < 60) return s + 's ago'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; }
function checkExpiry(expiryDateStr) {
  if (!expiryDateStr) return '';
  const today = new Date(); const expiry = new Date(expiryDateStr); const diffTime = expiry - today; const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return '<br><span class="expired">⚠️ EXPIRED (' + diffDays + ' days ago)</span>';
  if (diffDays <= 30) return '<br><span class="expired">⚠️ Expires in ' + diffDays + ' days</span>';
  return '<br><span class="valid">✅ Valid until ' + expiryDateStr + '</span>';
}

function render() {
  try {
    const today = todayStart();
    const todays = allRecords.filter(function(r) { return r.timestamp && r.timestamp >= today; });
    const onSiteNow = Object.values(statusData).filter(function(s) { return s && s.onSite; }).length;
    const totalIns = todays.filter(function(r) { return r.action === 'IN'; }).length;
    const recent = todays.filter(function(r) { return Date.now() - r.timestamp < 15 * 60 * 1000; }).length;
    const uniqueIds = [];
    todays.forEach(function(r) { if (uniqueIds.indexOf(r.operativeId) === -1) uniqueIds.push(r.operativeId); });
    document.getElementById('onsite').textContent = onSiteNow;
    document.getElementById('total').textContent = totalIns;
    document.getElementById('recent').textContent = recent;
    document.getElementById('unique').textContent = uniqueIds.length;
    const companyCount = {};
    Object.values(statusData).forEach(function(s) { if (s && s.onSite) { const company = s.company || 'Unknown'; companyCount[company] = (companyCount[company] || 0) + 1; } });
    const companies = Object.entries(companyCount).sort(function(a, b) { return b[1] - a[1]; });
    const grid = document.getElementById('companyGrid');
    if (companies.length === 0) { grid.innerHTML = '<div class="empty">No operatives on site</div>'; }
    else { grid.innerHTML = companies.map(function(item) { return '<div class="company-item"><div class="company-name">' + escapeHtml(item[0]) + '</div><div class="company-count">' + item[1] + '</div></div>'; }).join(''); }
    const tbody = document.getElementById('tbody');
    const filter = document.getElementById('search').value.toLowerCase();
    let records = todays.filter(function(r) {
      const op = operativesData[r.operativeId] || {};
      const name = r.operativeName ? r.operativeName.toLowerCase() : '';
      const company = r.operativeCompany ? r.operativeCompany.toLowerCase() : '';
      const method = r.method ? r.method.toLowerCase() : '';
      const phone = op.phone ? op.phone.toLowerCase() : '';
      const quals = op.qualifications ? op.qualifications.toLowerCase() : '';
      return name.indexOf(filter) !== -1 || company.indexOf(filter) !== -1 || method.indexOf(filter) !== -1 || phone.indexOf(filter) !== -1 || quals.indexOf(filter) !== -1;
    });
    records.sort(function(a, b) { return b.timestamp - a.timestamp; });
    if (records.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="empty">No records today</td></tr>'; }
    else {
      tbody.innerHTML = records.map(function(r) {
        const time = new Date(r.timestamp).toLocaleTimeString();
        const methodClass = r.method === 'FACE' ? 'face' : 'qr';
        const actionClass = r.action === 'IN' ? 'in' : 'out';
        const op = operativesData[r.operativeId] || {};
        let locationHtml = '<span style="color:#64748b">No location</span>';
        if (r.location && r.location.address) {
          const mapUrl = 'https://www.google.com/maps?q=' + r.location.lat + ',' + r.location.lng;
          locationHtml = '<span class="location-icon">📍</span><span class="location-cell" title="' + escapeHtml(r.location.address) + '">' + escapeHtml(r.location.address) + '</span><a href="' + mapUrl + '" target="_blank" class="map-link">View</a>';
        } else if (r.location && r.location.lat) {
          const mapUrl = 'https://www.google.com/maps?q=' + r.location.lat + ',' + r.location.lng;
          locationHtml = '<span class="location-cell">' + r.location.lat.toFixed(4) + ', ' + r.location.lng.toFixed(4) + '</span><a href="' + mapUrl + '" target="_blank" class="map-link">View</a>';
        }
        const contactHtml = '<div style="font-weight:600; font-size:14px;">' + (op.phone ? '📞 ' + escapeHtml(op.phone) : '<span style="color:#64748b">No phone</span>') + '</div>' + (op.supervisor ? '<div style="font-size:12px; color:#94a3b8; margin-top:4px;">👤 ' + escapeHtml(op.supervisor) + '</div>' : '');
        const qualsHtml = '<div style="font-weight:600; font-size:14px;">' + (op.qualifications ? escapeHtml(op.qualifications) : '<span style="color:#64748b">None recorded</span>') + '</div>' + checkExpiry(op.qualExpiry);
        return '<tr><td><div style="font-weight:700; font-size:15px;">' + escapeHtml(r.operativeName) + '</div>' + (r.operativeCompany ? '<div style="font-size:12px; color:#f97316; margin-top:4px;">' + escapeHtml(r.operativeCompany) + '</div>' : '') + '</td><td>' + contactHtml + '</td><td>' + qualsHtml + '</td><td><span class="method-badge ' + methodClass + '">' + (r.method || 'Unknown') + '</span></td><td><span class="action-badge ' + actionClass + '">' + (r.action || 'Unknown') + '</span></td><td>' + locationHtml + '</td><td class="time">' + time + '<br><span style="font-size:11px; color:#64748b">' + timeAgo(r.timestamp) + '</span></td></tr>';
      }).join('');
    }
  } catch (err) { console.error('Render error:', err); document.getElementById('tbody').innerHTML = '<tr><td colspan="7" class="empty">Error: ' + err.message + '</td></tr>'; }
}

signinsRef.on('value', function(snap) {
  allRecords = [];
  snap.forEach(function(child) { const val = child.val(); if (val) { allRecords.push({ id: child.key }); Object.keys(val).forEach(function(key) { allRecords[allRecords.length - 1][key] = val[key]; }); } });
  render();
}, function(error) { console.error('Signins error:', error); document.getElementById('tbody').innerHTML = '<tr><td colspan="7" class="empty">Database error: ' + error.message + '</td></tr>'; });

statusRef.on('value', function(snap) { statusData = {}; snap.forEach(function(child) { statusData[child.key] = child.val(); }); render(); });

operativesRef.on('value', function(snap) { operativesData = {}; snap.forEach(function(child) { operativesData[child.key] = child.val(); }); render(); });

document.getElementById('search').addEventListener('input', render);

function exportCSV() {
  const today = todayStart();
  const data = allRecords.filter(function(r) { return r.timestamp && r.timestamp >= today; });
  if (data.length === 0) { alert('No records to export'); return; }
  let csv = 'Date,Time,Name,Company,Phone,Supervisor,Qualifications,QualExpiry,Method,Action,Location,Lat,Lng\n';
  data.sort(function(a, b) { return a.timestamp - b.timestamp; }).forEach(function(r) {
    const op = operativesData[r.operativeId] || {};
    const date = new Date(r.timestamp).toISOString().split('T')[0];
    const time = new Date(r.timestamp).toLocaleTimeString();
    const loc = r.location ? r.location.address || (r.location.lat + ',' + r.location.lng) : '';
    const lat = r.location ? r.location.lat : '';
    const lng = r.location ? r.location.lng : '';
    csv += '"' + date + '","' + time + '","' + (r.operativeName || '') + '","' + (r.operativeCompany || '') + '","' + (op.phone || '') + '","' + (op.supervisor || '') + '","' + (op.qualifications || '') + '","' + (op.qualExpiry || '') + '","' + (r.method || '') + '","' + (r.action || '') + '","' + loc + '","' + lat + '","' + lng + '"\n';
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'face-reader-matrix-' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
}

async function clearToday() {
  if (!confirm('⚠️ Reset dashboard for demo? This will delete today\'s records and reset the live status.')) return;
  const today = todayStart();
  const updates = {};
  allRecords.forEach(function(r) { if (r.timestamp && r.timestamp >= today) { updates['signins/' + r.id] = null; } });
  updates['status'] = null;
  try { await db.ref().update(updates); alert('✅ Dashboard reset successfully!'); location.reload(); } catch (err) { alert('Error: ' + err.message); }
}

settingsRef.on('value', function(snap) {
  const data = snap.val();
  if (!data) return;
  document.documentElement.style.setProperty('--primary-color', data.color || '#06b6d4');
  document.documentElement.style.setProperty('--secondary-color', data.color2 || '#10b981');
  const footerEl = document.getElementById('brandFooter');
  if (footerEl) footerEl.textContent = data.footer || 'Face Reader Premium © 2026';
});

render();
</script>
</body>
</html>
