<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Reader - Office</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root { --primary: #06b6d4; --secondary: #10b981; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; margin-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.1); }
.logo { font-size: 28px; font-weight: 900; color: var(--primary); }
.badge { background: linear-gradient(135deg, var(--secondary), #059669); padding: 6px 12px; border-radius: 15px; font-size: 11px; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
.stat { background: rgba(30, 41, 59, 0.8); padding: 20px; border-radius: 15px; text-align: center; }
.num { font-size: 42px; font-weight: 900; margin-bottom: 5px; }
.green { color: #10b981; } .blue { color: #06b6d4; } .amber { color: #f97316; } .purple { color: #a855f7; }
.label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
.card { background: rgba(30, 41, 59, 0.8); padding: 20px; border-radius: 15px; margin-bottom: 20px; }
.controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
select, button { padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; color: #fff; font-size: 13px; }
select { background: rgba(15, 23, 42, 0.6); border: 2px solid rgba(255,255,255,0.1); color: #fff; min-width: 150px; }
button { background: linear-gradient(135deg, var(--primary), #0891b2); }
.btn-refresh { background: linear-gradient(135deg, #6366f1, #4f46e5); }
.btn-export { background: linear-gradient(135deg, var(--secondary), #059669); }
.btn-clear { background: linear-gradient(135deg, #ef4444, #dc2626); }
table { width: 100%; border-collapse: collapse; }
th { background: rgba(15, 23, 42, 0.9); padding: 12px; text-align: left; font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
tr:hover { background: rgba(255,255,255,0.03); }
.method-badge, .action-badge { padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; display: inline-block; }
.face { background: rgba(6, 182, 212, 0.2); color: #22d3ee; }
.qr { background: rgba(140, 142, 144, 0.2); color: #8C8E90; }
.in { background: rgba(16, 185, 129, 0.2); color: #34d399; }
.out { background: rgba(249, 115, 22, 0.2); color: #fbbf24; }
.time { color: #94a3b8; font-family: 'Courier New', monospace; font-size: 12px; }
.empty { text-align: center; color: #64748b; padding: 40px; }
.footer { text-align: center; font-size: 11px; color: #64748b; margin-top: 30px; padding: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); }
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">FACE READER</div>
<div class="badge">● Live</div>
</header>
<div class="stats">
<div class="stat"><div class="num green" id="onsite">0</div><div class="label">On Site</div></div>
<div class="stat"><div class="num blue" id="total">0</div><div class="label">Sign-Ins Today</div></div>
<div class="stat"><div class="num amber" id="recent">0</div><div class="label">Last 15 Min</div></div>
<div class="stat"><div class="num purple" id="unique">0</div><div class="label">Unique</div></div>
</div>
<div class="controls">
<select id="locationFilter" onchange="applyFilters()"><option value="all">All Locations</option></select>
<button class="btn-refresh" onclick="location.reload()">↻ Refresh</button>
<button class="btn-export" onclick="exportCSV()">📥 Export CSV</button>
<button class="btn-clear" onclick="clearToday()"> Clear</button>
</div>
<div class="card">
<table>
<thead><tr><th>Operative</th><th>Company</th><th>Location</th><th>Method</th><th>Action</th><th>Time</th></tr></thead>
<tbody id="tbody"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
</table>
</div>
<div class="footer">We Are A Team Together Ltd © 2026</div>
</div>
<script>
const SITE_ID = "I";
const firebaseConfig = {
apiKey: "AIzaSyCjpAPXDDsHHgAwVng535ZhDwj604zCBZw",
authDomain: "signin-facereader.firebaseapp.com",
databaseURL: "https://signin-facereader-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "signin-facereader",
storageBucket: "signin-facereader.firebasestorage.app",
messagingSenderId: "815339415778",
appId: "1:815339415778:web:d4b131f38c8d6a42f716bb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const signinsRef = db.ref('sites/' + SITE_ID + '/signins');
const statusRef = db.ref('sites/' + SITE_ID + '/status');
const operativesRef = db.ref('sites/' + SITE_ID + '/operatives');
let allRecords = [], statusData = {}, operativesData = {}, allLocations = new Set(['all']);

function todayStart() { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function escapeHtml(t) { if(!t) return ''; const m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}; return String(t).replace(/[&<>"]/g, s=>m[s]); }
function timeAgo(ts) { if(!ts) return ''; const s=Math.floor((Date.now()-ts)/1000); if(s<60) return s+'s ago'; if(s<3600) return Math.floor(s/60)+'m ago'; return Math.floor(s/3600)+'h ago'; }

function applyFilters() {
const today = todayStart(), loc = document.getElementById('locationFilter').value;
let records = allRecords.filter(r => r.timestamp && r.timestamp >= today);
if(loc !== 'all') records = records.filter(r => r.assignedLocation === loc);
render(records);
updateStats(records);
}

function updateStats(records) {
let onSite = 0;
Object.values(statusData).forEach(s => { if(s && s.onSite) onSite++; });
document.getElementById('onsite').textContent = onSite;
document.getElementById('total').textContent = records.filter(r => r.action === 'IN').length;
document.getElementById('recent').textContent = records.filter(r => Date.now() - r.timestamp < 15*60*1000).length;
document.getElementById('unique').textContent = new Set(records.map(r => r.operativeId)).size;
}

function render(records) {
const tbody = document.getElementById('tbody');
if(!records.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">No records today</td></tr>'; return; }
records.sort((a,b) => b.timestamp - a.timestamp);
tbody.innerHTML = records.map(r => {
const time = new Date(r.timestamp).toLocaleTimeString();
const methodClass = r.method === 'FACE' ? 'face' : 'qr';
const actionClass = r.action === 'IN' ? 'in' : 'out';
const op = operativesData[r.operativeId] || {};
return `<tr>
<td><div style="font-weight:700">${escapeHtml(r.operativeName)}</div><div style="font-size:11px;color:#f97316">${escapeHtml(r.operativeCompany)}</div></td>
<td>${escapeHtml(op.company||'')}</td>
<td><div style="color:#a855f7;font-size:11px">${escapeHtml(r.assignedLocation||'Unassigned')}</div></td>
<td><span class="method-badge ${methodClass}">${r.method}</span></td>
<td><span class="action-badge ${actionClass}">${r.action}</span></td>
<td><div class="time">${time}</div><div style="font-size:10px;color:#64748b">${timeAgo(r.timestamp)}</div></td>
</tr>`;
}).join('');
}

function updateLocationDropdown() {
const select = document.getElementById('locationFilter'), current = select.value;
allRecords.forEach(r => { if(r.assignedLocation && r.assignedLocation !== 'Unassigned') allLocations.add(r.assignedLocation); });
Object.values(statusData).forEach(s => { if(s && s.assignedLocation && s.assignedLocation !== 'Unassigned') allLocations.add(s.assignedLocation); });
Object.values(operativesData).forEach(o => { if(o.location && o.location !== 'Unassigned') allLocations.add(o.location); });
select.innerHTML = '';
Array.from(allLocations).sort().forEach(loc => {
const opt = document.createElement('option'); opt.value = loc; opt.textContent = loc === 'all' ? 'All Locations' : loc;
select.appendChild(opt);
});
select.value = allLocations.has(current) ? current : 'all';
}

signinsRef.on('value', snap => {
allRecords = [];
snap.forEach(child => { const v = child.val(); if(v) allRecords.push({id:child.key, ...v}); });
updateLocationDropdown();
applyFilters();
});

statusRef.on('value', snap => {
statusData = {};
snap.forEach(child => { const v = child.val(); if(v) statusData[child.key] = v; });
updateLocationDropdown();
applyFilters();
});

operativesRef.on('value', snap => {
operativesData = {};
snap.forEach(child => { operativesData[child.key] = child.val(); });
updateLocationDropdown();
applyFilters();
});

function exportCSV() {
const today = todayStart();
const data = allRecords.filter(r => r.timestamp && r.timestamp >= today);
if(!data.length) { alert('No records'); return; }
let csv = 'Date,Time,Name,Company,Location,Method,Action\n';
data.sort((a,b) => a.timestamp - b.timestamp).forEach(r => {
const date = new Date(r.timestamp).toISOString().split('T')[0];
const time = new Date(r.timestamp).toLocaleTimeString();
csv += `"${date}","${time}","${r.operativeName}","${r.operativeCompany}","${r.assignedLocation}","${r.method}","${r.action}"\n`;
});
const blob = new Blob([csv], {type:'text/csv'});
const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `face-reader-${new Date().toISOString().split('T')[0]}.csv`; a.click();
}

async function clearToday() {
if(!confirm('Clear today\'s records?')) return;
const today = todayStart(), updates = {};
allRecords.forEach(r => { if(r.timestamp && r.timestamp >= today) updates['sites/'+SITE_ID+'/signins/'+r.id] = null; });
Object.keys(statusData).forEach(id => { updates['sites/'+SITE_ID+'/status/'+id] = {onSite:false, lastAction:'CLEARED', lastTimestamp:firebase.database.ServerValue.TIMESTAMP}; });
await db.ref().update(updates);
alert('Cleared!');
location.reload();
}
</script>
</body>
</html>
